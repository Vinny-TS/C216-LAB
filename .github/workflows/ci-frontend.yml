name: CI Frontend

on:
  push:
    branches: [ "main", "aulas", "pratica-*" ]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [ "main", "aulas" ]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Verificação de Formatação (Biome)
        run: npm run format:check

      - name: Testes Unitários e Integração (Vitest)
        run: npm run test

      - name: Build de Produção
        run: npm run build

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

