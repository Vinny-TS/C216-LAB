version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: c216_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: c216_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/c216_db
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data: